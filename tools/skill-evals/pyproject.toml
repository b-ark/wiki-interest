[project]
name = "skill-evals"
version = "0.1.0"
description = "Evaluation harness for the wiki-interest agent skill: runs scenarios through a real agent, grades outputs, compares SKILL.md versions."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "b-ark" }]
dependencies = [
  "httpx>=0.27",
  "pydantic>=2.8",
  "typer>=0.12",
  "rich>=13",
  "pypdf>=5",
]

[project.scripts]
skill-evals = "skill_evals.cli:app"

[dependency-groups]
dev = [
  "pytest>=8.3",
  "ruff>=0.6",
  "mypy>=1.11",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["skill_evals"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["skill_evals", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "D", "UP", "B", "SIM", "C4", "PT", "RET", "ARG", "PL", "RUF"]
ignore = ["D105", "D107"]
# Intentional in regexes and report text: Unicode minus, thin spaces, multiplication sign,
# full-width question mark and Cyrillic letters that prose from the agent really contains.
allowed-confusables = ["−", "×", "？", " ", " ", "А", "у", "·", "–"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
known-first-party = ["skill_evals"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "PLR2004", "ARG001", "PLR0913"]
# Typer commands are one option per knob by design; the logic lives in the modules.
"skill_evals/cli.py" = ["PLR0913", "PLR0917"]

[tool.mypy]
python_version = "3.12"
files = ["skill_evals", "tests"]
strict = true
warn_unreachable = true
pretty = true
show_error_codes = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers --strict-config"
xfail_strict = true
