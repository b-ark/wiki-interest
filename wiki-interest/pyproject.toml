[project]
name = "wiki-interest"
version = "0.1.0"
description = "Agent skill: analyse Wikipedia pageview interest in topics across language editions, build charts and one-page reports."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "b-ark" }]
keywords = ["agent-skill", "wikipedia", "pageviews", "analytics", "market-research"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
  "httpx>=0.27",
  "tenacity>=8.4",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "numpy>=2.0",
  "pandas>=2.2",
  "scipy>=1.14",
  "matplotlib>=3.9",
  "fpdf2>=2.7",
  "typer>=0.12",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-cov>=5.0",
  "respx>=0.21",
  "hypothesis>=6.100",
  "ruff>=0.6",
  "mypy>=1.11",
  "import-linter>=2.0",
  "pypdf>=4.3",
  "pymannkendall>=1.4.3",
  "pandas-stubs>=2.2",
  "scipy-stubs",
  "pre-commit>=3.8",
  "skills-ref",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["wiki_interest"]

# ---------------------------------------------------------------------------
# Lint and format
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["wiki_interest", "tests", "scripts"]

[tool.ruff.lint]
select = [
  "E", "W",   # pycodestyle
  "F",        # pyflakes
  "I",        # isort
  "N",        # pep8-naming
  "D",        # pydocstyle: every public object documented
  "UP",       # pyupgrade
  "B",        # bugbear
  "SIM",      # simplify
  "C4",       # comprehensions
  "PT",       # pytest style
  "RET",      # return consistency
  "ARG",      # unused arguments
  "PL",       # pylint subset: complexity, magic numbers, too-many-args
  "RUF",      # ruff-specific
]
ignore = [
  "D105",  # magic methods need no docstring
  "D107",  # __init__ is documented on the class
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
known-first-party = ["wiki_interest"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
  "D",        # test names are the documentation
  "PLR2004",  # literal expected values are the point of a test
  "PLR0913",  # fake/builder helpers legitimately take many keyword arguments
  "ARG001",   # fixtures are injected by name
  "ARG002",   # fakes must honour port signatures even when they ignore an argument
]

# ---------------------------------------------------------------------------
# Types
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
files = ["wiki_interest", "tests"]
strict = true
warn_unreachable = true
pretty = true
show_error_codes = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["fpdf.*", "pymannkendall.*"]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# ---------------------------------------------------------------------------
# Architecture boundaries (checked by `lint-imports`)
# ---------------------------------------------------------------------------
[tool.importlinter]
root_package = "wiki_interest"

[[tool.importlinter.contracts]]
name = "Dependencies point inwards: cli -> application|adapters -> ports -> contracts -> domain"
type = "layers"
layers = [
  "wiki_interest.cli",
  "wiki_interest.application | wiki_interest.adapters",
  "wiki_interest.ports",
  "wiki_interest.contracts",
  "wiki_interest.domain",
]

# ---------------------------------------------------------------------------
# Tests
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = "-q --strict-markers --strict-config -m 'not live'"
markers = [
  "live: talks to the real Wikimedia APIs; deselected by default, run with `pytest -m live`",
  "slow: takes more than a few seconds",
]
xfail_strict = true

[tool.coverage.run]
source = ["wiki_interest"]
branch = true

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = true
exclude_also = [
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
  "@overload",
]
